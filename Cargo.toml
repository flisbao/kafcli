[workspace]
resolver = "3"
members = ["crates/kafcli", "crates/kafcli-core"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Felipe Lisbão"]
repository = "https://github.com/flisbao/kafcli"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
allow_attributes_without_reason = "deny"
needless_pass_by_value = "deny"
redundant_clone = "deny"
significant_drop_tightening = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[workspace.dependencies]
kafcli-core = { path = "crates/kafcli-core" }
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "ssl-vendored", "libz-static", "curl-static", "zstd"] }
clap = { version = "4.6", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aws-lc-rs = "1"
rustls-pki-types = { version = "1", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
keyring = "4.2"
thiserror = "2"
anyhow = "1"
apache-avro = { version = "0.23", default-features = false }
jsonschema = { version = "0.61", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comfy-table = "8"
time = { version = "0.3", features = ["formatting"] }
dirs = "7"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
