# Redpanda brokers for the kafcli integration tests (see README.md).
#
#   redpanda-plaintext  localhost:19092  no authentication; Schema Registry at localhost:18081
#   redpanda-scram      localhost:29092  SASL_PLAINTEXT, SCRAM-SHA-256, user kafcli
#   redpanda-mtls       localhost:39092  TLS with mandatory client certificates
#   kafka-oauth         localhost:49092  SASL_PLAINTEXT, OAUTHBEARER (unsecured JWT, alg none)
#   kafka-plaintext     localhost:59092  Apache Kafka, no authentication; ships kafka-consumer-groups.sh
#
# Each broker exposes its admin API on its own host port (19644, 29644, 39644).
# The certificates for redpanda-mtls come from generate-certificates.sh.
name: kafcli-fixtures

x-redpanda: &redpanda
  image: docker.redpanda.com/redpandadata/redpanda:v25.3.18
  # The image entrypoint runs `rpk` with a read-only config mount, which rpk cannot rewrite,
  # so the broker config is copied into the data directory first.
  entrypoint: ["/bin/bash", "-c"]
  healthcheck:
    test: ["CMD-SHELL", "rpk -X admin.hosts=localhost:9644 cluster health | grep -q 'Healthy:.*true'"]
    interval: 2s
    timeout: 5s
    retries: 60
    start_period: 5s

services:
  redpanda-plaintext:
    <<: *redpanda
    command:
      - >-
        cp /fixtures/redpanda.yaml /var/lib/redpanda/redpanda.yaml &&
        exec rpk redpanda start --mode dev-container --smp 1 --config /var/lib/redpanda/redpanda.yaml
    configs:
      - source: plaintext-broker-config
        target: /fixtures/redpanda.yaml
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
      - "127.0.0.1:18081:8081"

  redpanda-scram:
    <<: *redpanda
    command:
      - >-
        cp /fixtures/redpanda.yaml /var/lib/redpanda/redpanda.yaml &&
        exec rpk redpanda start --mode dev-container --smp 1 --config /var/lib/redpanda/redpanda.yaml
    configs:
      - source: scram-broker-config
        target: /fixtures/redpanda.yaml
    ports:
      - "127.0.0.1:29092:29092"
      - "127.0.0.1:29644:9644"

  # Creates the SCRAM user and turns SASL on once the broker answers its admin API, then stays up.
  # `up --wait` gates on its healthcheck, which passes only after the user exists and SASL is
  # enabled, so the SCRAM tests never run before the broker accepts authentication. It is a
  # long-running service because `up --wait` fails when a one-shot service exits.
  redpanda-scram-bootstrap:
    <<: *redpanda
    depends_on:
      redpanda-scram:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    environment:
      KAFCLI_IT_SCRAM_PASSWORD: kafcli-it-scram-secret
    command:
      - >-
        rpk -X admin.hosts=redpanda-scram:9644 security user create kafcli
        -p "$$KAFCLI_IT_SCRAM_PASSWORD" --mechanism SCRAM-SHA-256 &&
        rpk -X admin.hosts=redpanda-scram:9644 cluster config set superusers '["kafcli"]' &&
        rpk -X admin.hosts=redpanda-scram:9644 cluster config set enable_sasl true &&
        rpk -X admin.hosts=redpanda-scram:9644 cluster config get enable_sasl | grep -qx true &&
        touch /tmp/ready &&
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  redpanda-mtls:
    <<: *redpanda
    command:
      - >-
        cp /fixtures/redpanda.yaml /var/lib/redpanda/redpanda.yaml &&
        exec rpk redpanda start --mode dev-container --smp 1 --config /var/lib/redpanda/redpanda.yaml
    configs:
      - source: mtls-broker-config
        target: /fixtures/redpanda.yaml
    volumes:
      - ./certificates:/certs:ro
    ports:
      - "127.0.0.1:39092:39092"
      - "127.0.0.1:39644:9644"

  # Apache Kafka in KRaft mode, one node. The EXTERNAL listener uses SASL_PLAINTEXT with OAUTHBEARER
  # and no callback handler, so the broker falls back to the unsecured validator: it accepts any JWT
  # with `alg: none` that carries an `exp` claim. Use it only for local tests.
  # INTERNAL (PLAINTEXT, 9092) serves the controller and the healthcheck.
  kafka-oauth:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:49092:49092"
    environment:
      KAFKA_CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:49092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://127.0.0.1:49092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: "OAUTHBEARER"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="admin";'
      KAFKA_CONNECTIONS_MAX_REAUTH_MS: "10000"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s

  # Apache Kafka in KRaft mode, one node, no authentication. The read-operation tests compare
  # kafcli with the Kafka tools in /opt/kafka/bin, which talk to the INTERNAL listener (9092).
  kafka-plaintext:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:59092:59092"
    environment:
      KAFKA_CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:59092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://localhost:59092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s

configs:
  plaintext-broker-config:
    content: |
      redpanda:
        data_directory: /var/lib/redpanda/data
        node_id: 0
        seed_servers: []
        rpc_server:
          address: 0.0.0.0
          port: 33145
        advertised_rpc_api:
          address: redpanda-plaintext
          port: 33145
        kafka_api:
          - name: internal
            address: 0.0.0.0
            port: 9092
            authentication_method: none
          - name: external
            address: 0.0.0.0
            port: 19092
            authentication_method: none
        advertised_kafka_api:
          - name: internal
            address: redpanda-plaintext
            port: 9092
          - name: external
            address: localhost
            port: 19092
        admin:
          - address: 0.0.0.0
            port: 9644
      schema_registry:
        schema_registry_api:
          - address: 0.0.0.0
            port: 8081
  scram-broker-config:
    content: |
      redpanda:
        data_directory: /var/lib/redpanda/data
        node_id: 0
        seed_servers: []
        rpc_server:
          address: 0.0.0.0
          port: 33145
        advertised_rpc_api:
          address: redpanda-scram
          port: 33145
        kafka_api:
          - name: internal
            address: 0.0.0.0
            port: 9092
            authentication_method: none
          - name: external
            address: 0.0.0.0
            port: 29092
            authentication_method: sasl
        advertised_kafka_api:
          - name: internal
            address: redpanda-scram
            port: 9092
          - name: external
            address: localhost
            port: 29092
        admin:
          - address: 0.0.0.0
            port: 9644
  mtls-broker-config:
    content: |
      redpanda:
        data_directory: /var/lib/redpanda/data
        node_id: 0
        seed_servers: []
        rpc_server:
          address: 0.0.0.0
          port: 33145
        advertised_rpc_api:
          address: redpanda-mtls
          port: 33145
        kafka_api:
          - name: internal
            address: 0.0.0.0
            port: 9092
            authentication_method: none
          - name: external
            address: 0.0.0.0
            port: 39092
            authentication_method: mtls_identity
        kafka_api_tls:
          - name: external
            enabled: true
            cert_file: /certs/server.pem
            key_file: /certs/server.key
            truststore_file: /certs/ca.pem
            require_client_auth: true
        advertised_kafka_api:
          - name: internal
            address: redpanda-mtls
            port: 9092
          - name: external
            address: localhost
            port: 39092
        admin:
          - address: 0.0.0.0
            port: 9644
